<!doctype html>
<html lang="en" class="dark" data-brand-name="SteelMont" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon-SteelMont.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B1220" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Spectrum Task & Planner" />
  <meta name="description" content="SteelMont — Spectrum Task & Planner" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Steelmont | Spectrum Task & Planner</title>
  <script>
    (function () {
      try {
        var path = (location.pathname || '/').replace(/\/+$/, '') || '/';
        var t = localStorage.getItem('steelmont-theme');
        if (path === '/login' || (t !== 'light' && t !== 'dark')) t = 'dark';
        var r = document.documentElement;
        r.classList.toggle('dark', t === 'dark');
        r.style.colorScheme = t;
        r.setAttribute('data-theme', t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'dark' ? '#0B1220' : '#F5F7F9');
      } catch (e) { }
    })();
  </script>
</head>

<body class="antialiased">
  <div id="root">
    <style>
      body {
        margin: 0;
      }

      .app-loader {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        background-color: #0B1220;
        font-family: system-ui, -apple-system, sans-serif;
        position: relative;
        overflow: hidden;
      }

      html:not(.dark) .app-loader {
        background-color: #F5F7F9;
      }

      .app-loader::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, rgba(14, 165, 233, 0.16), transparent 52%);
        pointer-events: none;
      }

      html:not(.dark) .app-loader::before {
        background: radial-gradient(ellipse at 50% 45%, rgba(14, 165, 233, 0.12), transparent 55%);
      }

      .brand-boot-wrap {
        position: relative;
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1;
      }

      .brand-boot-ring {
        position: absolute;
        border-radius: 999px;
        border-style: solid;
        border-color: transparent;
        box-sizing: border-box;
      }

      .brand-boot-ring-1 {
        inset: 0;
        border-width: 2px;
        border-top-color: #0EA5E9;
        border-right-color: rgba(14, 165, 233, 0.4);
        animation: brand-boot-cw 1.1s linear infinite;
      }

      .brand-boot-ring-2 {
        inset: 6px;
        border-width: 2px;
        border-bottom-color: #F59E0B;
        border-left-color: rgba(245, 158, 11, 0.5);
        animation: brand-boot-ccw 1.6s linear infinite;
      }

      .brand-boot-ring-3 {
        inset: 12px;
        border-width: 2px;
        border-top-color: rgba(56, 189, 248, 0.9);
        border-right-color: rgba(52, 211, 153, 0.5);
        animation: brand-boot-cw 2.2s linear infinite;
      }

      .brand-boot-mark {
        position: relative;
        z-index: 2;
        width: 56px;
        height: 56px;
        border-radius: 999px;
        background: #0C4A6E;
        color: #E2E8F0;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      html:not(.dark) .brand-boot-mark {
        background: #ffffff;
        color: #0B1824;
        box-shadow: 0 8px 24px rgba(8, 28, 48, 0.12);
        border: 1px solid #e2e8f0;
      }

      .loading-text {
        margin-top: 14px;
        color: #94A3B8;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        z-index: 1;
      }

      html:not(.dark) .loading-text {
        color: #64748b;
      }

      @keyframes brand-boot-cw {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes brand-boot-ccw {
        to {
          transform: rotate(-360deg);
        }
      }

      @keyframes pulse {

        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: .5;
        }
      }
    </style>
    <div class="app-loader" role="status" aria-live="polite" aria-label="Loading">
      <div class="brand-boot-wrap">
        <span class="brand-boot-ring brand-boot-ring-1" aria-hidden="true"></span>
        <span class="brand-boot-ring brand-boot-ring-2" aria-hidden="true"></span>
        <span class="brand-boot-ring brand-boot-ring-3" aria-hidden="true"></span>
        <div class="brand-boot-mark" id="brand-boot-initials">SM</div>
      </div>
      <div class="loading-text">Loading</div>
    </div>
    <script>
      (function () {
        var name = document.documentElement.getAttribute('data-brand-name') || 'SteelMont';
        var spaced = name.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[^a-zA-Z0-9\s]/g, ' ').trim();
        var parts = spaced.split(/\s+/).filter(Boolean);
        var initials = (parts.map(function (p) { return p.charAt(0); }).join('') || 'SM').toUpperCase().slice(0, 3);
        var el = document.getElementById('brand-boot-initials');
        if (el) el.textContent = initials;
      })();
    </script>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
